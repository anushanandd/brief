[package]
name = "brief"
version = "0.1.0"
description = "A calm, local-first personal finance workspace"
authors = ["Brief"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "brief_lib"
crate-type = ["rlib"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.11"
argon2 = "0.6"
base64 = "0.22"
bytes = "1"
calamine = { version = "0.36.1", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
csv = "1"
flate2 = "1"
futures-util = "0.3"
hmac = "0.12"
keyring = { version = "3", features = ["apple-native"] }
parquet = { version = "60", default-features = false, features = ["zstd"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.34", features = ["backup", "bundled"] }
rust_decimal = { version = "1.39", features = ["serde-float"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "~2.7"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["macros", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl", "serde-json-impl"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSButton",
  "NSPasteboard",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSError",
  "NSString",
  "std",
] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = [
  "LAContext",
  "block2",
  "std",
] }
objc2-service-management = { version = "0.3.2", default-features = false, features = [
  "SMAppService",
  "objc2",
  "objc2-foundation",
  "std",
] }
