[package]
name = "brief"
version = "0.1.0"
description = "A calm, local-first personal finance workspace"
authors = ["Brief"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "brief_lib"
crate-type = ["rlib"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hmac = "0.12"
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.34", features = ["backup", "bundled"] }
rust_decimal = { version = "1.39", features = ["serde-float"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["macros", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSError",
  "NSString",
  "std",
] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = [
  "LAContext",
  "block2",
  "std",
] }
